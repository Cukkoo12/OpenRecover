name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit tests
        run: cargo test --locked --verbose
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Package Windows release archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME } else { 'latest' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/openrecover.exe, target/release/openrecover-cli.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "dist/OpenRecover-$tag-windows-x64.zip" -Force
      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: openrecover-windows-x64
          path: |
            dist/openrecover.exe
            dist/openrecover-cli.exe
            dist/OpenRecover-*.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: openrecover-windows-x64
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$GH_REPO" --clobber
          else
            gh release create "$TAG" dist/* -R "$GH_REPO" --title "OpenRecover $TAG" --generate-notes
          fi
